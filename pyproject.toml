[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "fresh-beast"
version = "0.1.0a1"
description = "BEAST/HLS non-stand-replacing disturbance detection for the FRESH ecosystem"
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [{name = "FRESH Lab", email = "noreply@example.org"}]
keywords = ["forestry", "remote sensing", "HLS", "BEAST", "disturbance", "NSR"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Science/Research",
  "Operating System :: POSIX :: Linux",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Scientific/Engineering",
  "Typing :: Typed",
]
dependencies = [
  "affine>=2.4",
  "earthaccess>=0.14",
  "geopandas>=0.14",
  "numpy>=1.26",
  "rasterio>=1.3",
  "shapely>=2.0",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6", "mypy>=1.10", "types-requests"]

[project.urls]
Homepage = "https://github.com/UBC-FRESH/fresh-beast"
Documentation = "https://github.com/UBC-FRESH/fresh-beast"
Repository = "https://github.com/UBC-FRESH/fresh-beast"
Issues = "https://github.com/UBC-FRESH/fresh-beast/issues"

[project.scripts]
fresh-beast = "fresh_beast.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
fresh_beast = ["R/*.R", "py.typed"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "UP", "D", "ANN", "N", "PT", "SIM", "RUF", "C4"]

[tool.ruff.lint.pydocstyle]
convention = "numpy"

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["D", "ANN"]
"src/fresh_beast/hls.py" = ["ANN401"]
"src/fresh_beast/io.py" = ["ANN401"]

[tool.mypy]
python_version = "3.11"
strict = true
files = ["src", "tests"]

[[tool.mypy.overrides]]
module = [
  "earthaccess", "earthaccess.*",
  "rasterio", "rasterio.*",
  "geopandas", "geopandas.*",
  "shapely", "shapely.*",
  "femic", "femic.*",
]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["tests.*"]
ignore_errors = true

[tool.pytest.ini_options]
testpaths = ["tests"]
